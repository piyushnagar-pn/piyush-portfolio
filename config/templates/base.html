{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#080b14">

    <meta name="description"
          content="Piyush Nagar - Web Developer Portfolio">

    <title>{% block title %}Piyush Portfolio{% endblock %}</title>

    <!-- Your CSS -->
    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">
          <link rel="icon" type="image/png" href="{% static 'fav.png' %}">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar glass-nav">

        <div class="nav-container">

            <!-- LOGO -->

            <a href="/" class="logo">
                <span class="logo-box">P</span>
                <span>Piyush<span class="logo-dot">.</span></span>
            </a>


            <!-- MOBILE MENU BUTTON -->

            <button class="menu-button"
                    id="menuButton"
                    aria-label="Open navigation"
                    aria-expanded="false">

                <span></span>
                <span></span>
                <span></span>

            </button>


            <!-- NAVIGATION -->

            <div class="nav-menu" id="navMenu">

                <a href="/" class="nav-link">
                    Home
                </a>

                <a href="/skill/" class="nav-link">
                    Skills
                </a>

                <a href="/contact/" class="nav-link">
                    Contact
                </a>

            </div>

        </div>

    </nav>


    <!-- ================= MAIN CONTENT ================= -->

    <main>

        {% block content %}
        {% endblock %}

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <p>
            © 2026 Piyush Nagar
        </p>

        <span>•</span>

        <p>
            Built with Django
        </p>

    </footer>


    <!-- ================= SMALL NAV SCRIPT ================= -->

    <script>

        const menuButton = document.getElementById("menuButton");
        const navMenu = document.getElementById("navMenu");

        menuButton.addEventListener("click", () => {

            const opened =
                navMenu.classList.toggle("open");

            menuButton.setAttribute(
                "aria-expanded",
                opened
            );

        });


        /* Close menu after clicking a link */

        document.querySelectorAll(".nav-link").forEach(link => {

            link.addEventListener("click", () => {

                navMenu.classList.remove("open");

                menuButton.setAttribute(
                    "aria-expanded",
                    "false"
                );

            });

        });

    </script>

</body>

</html>
